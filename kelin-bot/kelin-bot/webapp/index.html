<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Bella Sposa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EFF3; --card:#FFFFFF; --ink:#2A1B2E; --muted:#7D6F83; --line:#E3DCE6;
  --mauve:#8F5A74; --mauve-ink:#FFFFFF; --gold:#B8996F; --soft:#EAE4EC;
  --sale:#B3445F; --new:#2A1B2E; --new-ink:#FFFFFF;
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#1A1220; --card:#261A2D; --ink:#F3EAF1; --muted:#A898AE; --line:#3A2B42;
  --mauve:#D79AB6; --mauve-ink:#2A1B2E; --gold:#D4B88C; --soft:#33263B;
  --sale:#E2708B; --new:#F3EAF1; --new-ink:#1A1220;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  max-width:560px;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--mauve);outline-offset:2px}

/* ---------- Header ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 18px 6px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1;letter-spacing:.01em}
.brand p{margin-top:8px;color:var(--muted);font-size:13px;max-width:230px}
.tools{display:flex;align-items:center;gap:8px;padding-top:2px}
.pill{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.pill button{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.pill button.on{background:var(--ink);color:var(--bg)}
.favbtn{position:relative;width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.favbtn svg{width:19px;height:19px}
.favbtn.on{background:var(--mauve);color:var(--mauve-ink)}
.favbtn.on svg{fill:currentColor}
.favbtn .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center}
.favbtn .badge:empty{display:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}

/* ---------- Search + chips ---------- */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0 10px}
.search{margin:0 18px 10px}
.search input{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:0 18px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- Grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;padding:14px 18px 8px}
.card{cursor:pointer}
.arch{position:relative;aspect-ratio:3/4;border-radius:999px 999px 16px 16px;overflow:hidden;background:var(--soft)}
.arch img,.slide img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;
  background:linear-gradient(170deg,var(--soft),color-mix(in srgb,var(--mauve) 22%,var(--soft)));
  color:var(--gold);font-family:var(--serif);font-size:42px}
.heart{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;color:var(--ink)}
.heart svg{width:17px;height:17px}
.heart.on{color:var(--sale)}
.heart.on svg{fill:currentColor}
.tag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:3px 12px;border-radius:999px;
  font-size:11px;font-weight:700;background:var(--new);color:var(--new-ink);white-space:nowrap}
.tag.sale{background:var(--sale);color:#fff}
.card h3{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;margin:10px 4px 2px}
.card .price{margin:0 4px;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.price b{font-weight:700}
.price s{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:56px 28px}
.empty .ph{width:84px;height:110px;margin:0 auto 14px;border-radius:999px 999px 12px 12px}

/* ---------- Contact ---------- */
.contact{margin:26px 18px 0;padding:24px 20px;border-radius:22px;background:var(--ink);color:var(--bg)}
.contact h2{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin-bottom:12px}
.contact p{font-size:14px;opacity:.88;margin-top:6px}
.contact .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.contact .btn{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.contact .btn.primary{background:var(--bg);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:23px;
  font-size:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--mauve);color:var(--mauve-ink)}

/* ---------- Sheet ---------- */
.wrap{position:fixed;inset:0;z-index:20;visibility:hidden}
.wrap.open{visibility:visible}
.backdrop{position:absolute;inset:0;background:rgba(20,10,25,.5);opacity:0;transition:opacity .25s}
.wrap.open .backdrop{opacity:1}
.sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;height:94%;transform:translate(-50%,100%);
  background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.wrap.open .sheet{transform:translate(-50%,0)}
.close{position:absolute;z-index:3;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
  background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center}
.close svg{width:16px;height:16px}
.scroll{flex:1;overflow-y:auto;padding-top:18px;overscroll-behavior:contain}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 11%;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 78%;scroll-snap-align:center;aspect-ratio:3/4;max-height:58vh;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--soft)}
.slide.single{margin:0 auto}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:20px;background:var(--mauve)}
.info{padding:18px 20px 20px}
.info .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.info h2{font-family:var(--serif);font-weight:600;font-size:36px;line-height:1}
.info .heart{position:static;background:var(--soft);width:42px;height:42px;flex:none}
.info .heart svg{width:20px;height:20px}
.info .price{margin-top:8px;font-size:18px;display:flex;gap:10px;align-items:baseline}
.info .price s{font-size:14px}
dl{margin-top:16px;border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
dt{color:var(--muted)}
dd{text-align:right;font-weight:600}
.info p.desc{margin-top:16px;color:var(--ink);opacity:.86;line-height:1.65}
.cta{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.cta .btn{flex:1}
.cta .btn.primary{flex:2}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 id="shopName">Bella Sposa</h1>
    <p id="tagline"></p>
  </div>
  <div class="tools">
    <button class="favbtn" id="favBtn" aria-label="Sevimlilar">
      <svg viewBox="0 0 24 24"><path d="M12 20.5C12 20.5 4 15.6 4 9.5A4.6 4.6 0 0 1 12 6.6A4.6 4.6 0 0 1 20 9.5C20 15.6 12 20.5 12 20.5Z"/></svg>
      <span class="badge" id="favCount"></span>
    </button>
    <div class="pill" id="langPill">
      <button data-l="uz">UZ</button><button data-l="ru">RU</button>
    </div>
  </div>
</header>

<div class="bar">
  <div class="search"><input id="q" type="search" autocomplete="off" enterkeyhint="search"></div>
  <nav class="chips" id="chips"></nav>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div class="ph"><span>✦</span></div>
    <p id="emptyText"></p>
  </div>
</main>

<section class="contact" id="contact"></section>

<div class="wrap" id="wrap" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const UI = {
  uz: { all:'Barchasi', new:'Yangi', sale:'Chegirma', search:"Ko'ylak qidirish", fav:'Sevimlilar',
        sizes:"O'lchamlar", colors:'Ranglar', fabric:'Mato', cat:'Toifa', cur:"so'm",
        empty:'Hech narsa topilmadi. Boshqa so\'z yoki toifani sinab ko\'ring.',
        emptyFav:"Sevimlilar bo'sh. Ko'ylakdagi yurakchani bosib saqlang.",
        write:'Telegramda yozish', call:"Qo'ng'iroq", contact:'Primerkaga yoziling',
        map:'Xaritada ochish', insta:'Instagram',
        msg:n=>`Assalomu alaykum! "${n}" ko'ylagi haqida ma'lumot olmoqchiman.` },
  ru: { all:'Все', new:'Новинки', sale:'Скидки', search:'Поиск платья', fav:'Избранное',
        sizes:'Размеры', colors:'Цвета', fabric:'Ткань', cat:'Категория', cur:'сум',
        empty:'Ничего не найдено. Попробуйте другое слово или категорию.',
        emptyFav:'В избранном пусто. Нажмите на сердечко у платья, чтобы сохранить.',
        write:'Написать в Telegram', call:'Позвонить', contact:'Запишитесь на примерку',
        map:'Открыть на карте', insta:'Instagram',
        msg:n=>`Здравствуйте! Хочу узнать подробнее о платье «${n}».` }
};
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5C12 20.5 4 15.6 4 9.5A4.6 4.6 0 0 1 12 6.6A4.6 4.6 0 0 1 20 9.5C20 15.6 12 20.5 12 20.5Z"/></svg>';
const CLOSE = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

let DATA = null, lang = 'uz', cat = 'all', query = '', favOnly = false, current = null;

/* ---------- storage (localStorage bo'lmasa ham ishlayveradi) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let favs = new Set((() => { try { return JSON.parse(store.get('favs') || '[]'); } catch(e){ return []; } })());
const saveFavs = () => store.set('favs', JSON.stringify([...favs]));

/* ---------- yordamchilar ---------- */
const t = k => UI[lang][k];
const L = o => (o && typeof o === 'object') ? (o[lang] || o.uz || '') : (o || '');
const money = n => Number(n).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ') + ' ' + t('cur');
const byId = id => DATA.products.find(p => p.id === id);
const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} };
const img = (src, alt) => `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="imgFail(this)">`;
window.imgFail = el => { const d = document.createElement('div'); d.className = 'ph'; d.innerHTML = '<span>✦</span>'; el.replaceWith(d); };

function openLink(url){
  if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (tg && tg.openLink && /^https?:/.test(url)) tg.openLink(url);
  else window.open(url, '_blank');
}

/* ---------- tema ---------- */
function applyTheme(){
  const dark = tg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch(e){}
}

/* ---------- render ---------- */
function visible(){
  const q = query.trim().toLowerCase();
  return DATA.products.filter(p => {
    if (favOnly && !favs.has(p.id)) return false;
    if (cat === 'new' || cat === 'sale') { if (p.tag !== cat) return false; }
    else if (cat !== 'all' && p.category !== cat) return false;
    if (q && !(p.name.toLowerCase().includes(q) || L(p.desc).toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderHeader(){
  document.documentElement.lang = lang;
  document.title = DATA.shop.name;
  $('#shopName').textContent = DATA.shop.name;
  $('#tagline').textContent = L(DATA.shop.tagline);
  $('#q').placeholder = t('search');
  $('#favBtn').setAttribute('aria-label', t('fav'));
  $('#favBtn').classList.toggle('on', favOnly);
  $('#favCount').textContent = favs.size || '';
  document.querySelectorAll('#langPill button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}

function renderChips(){
  const items = [['all', t('all')]];
  if (DATA.products.some(p => p.tag === 'new')) items.push(['new', t('new')]);
  if (DATA.products.some(p => p.tag === 'sale')) items.push(['sale', t('sale')]);
  DATA.categories.forEach(c => items.push([c.id, L(c.name)]));
  $('#chips').innerHTML = items.map(([id, label]) =>
    `<button class="chip ${id === cat ? 'on' : ''}" data-cat="${esc(id)}">${esc(label)}</button>`).join('');
}

function card(p){
  const fav = favs.has(p.id);
  return `<article class="card" data-id="${p.id}">
    <div class="arch">
      ${p.images && p.images[0] ? img(p.images[0], p.name) : '<div class="ph"><span>✦</span></div>'}
      ${p.tag ? `<span class="tag ${esc(p.tag)}">${t(p.tag)}</span>` : ''}
      <button class="heart ${fav ? 'on' : ''}" data-fav="${p.id}" aria-label="${esc(t('fav'))}">${HEART}</button>
    </div>
    <h3>${esc(p.name)}</h3>
    <div class="price"><b>${money(p.price)}</b>${p.old_price ? `<s>${money(p.old_price)}</s>` : ''}</div>
  </article>`;
}

function renderGrid(){
  const list = visible();
  $('#grid').innerHTML = list.map(card).join('');
  $('#empty').hidden = list.length > 0;
  $('#emptyText').textContent = favOnly && !favs.size ? t('emptyFav') : t('empty');
}

function renderContact(){
  const s = DATA.shop, tel = s.phone.replace(/[^\d+]/g, '');
  const map = `https://www.google.com/maps?q=${s.lat},${s.lon}`;
  $('#contact').innerHTML = `
    <h2>${esc(t('contact'))}</h2>
    <p>${esc(L(s.address))}</p>
    <p>${esc(L(s.hours))}</p>
    <div class="acts">
      <a class="btn primary" href="https://t.me/${esc(s.telegram)}" data-ext>${esc(t('write'))}</a>
      <a class="btn" href="tel:${esc(tel)}">${esc(s.phone)}</a>
      <a class="btn" href="${esc(map)}" data-ext>${esc(t('map'))}</a>
      <a class="btn" href="${esc(s.instagram)}" data-ext>${esc(t('insta'))}</a>
    </div>`;
}

function renderAll(){ renderHeader(); renderChips(); renderGrid(); renderContact(); if (current) openSheet(current, true); }

/* ---------- sheet ---------- */
function openSheet(id, keepState){
  const p = byId(id); if (!p) return;
  current = id;
  const imgs = (p.images && p.images.length) ? p.images : [''];
  const s = DATA.shop;
  const tgLink = `https://t.me/${s.telegram}?text=${encodeURIComponent(t('msg')(p.name))}`;
  const tel = s.phone.replace(/[^\d+]/g, '');
  const rows = [
    [t('cat'), (DATA.categories.find(c => c.id === p.category) || {}).name],
    [t('sizes'), p.sizes], [t('colors'), p.colors], [t('fabric'), p.fabric]
  ].filter(r => r[1]).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(L(v))}</dd></div>`).join('');

  $('#sheet').innerHTML = `
    <button class="close" id="closeBtn" aria-label="Close">${CLOSE}</button>
    <div class="scroll">
      <div class="gal" id="gal">${imgs.map(src =>
        `<div class="slide ${imgs.length === 1 ? 'single' : ''}">${src ? img(src, p.name) : '<div class="ph"><span>✦</span></div>'}</div>`).join('')}</div>
      ${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      <div class="info">
        <div class="head"><h2>${esc(p.name)}</h2>
          <button class="heart ${favs.has(p.id) ? 'on' : ''}" data-fav="${p.id}" aria-label="${esc(t('fav'))}">${HEART}</button></div>
        <div class="price"><b>${money(p.price)}</b>${p.old_price ? `<s>${money(p.old_price)}</s>` : ''}</div>
        <dl>${rows}</dl>
        ${p.desc ? `<p class="desc">${esc(L(p.desc))}</p>` : ''}
      </div>
    </div>
    <div class="cta">
      <a class="btn primary" href="${esc(tgLink)}" data-ext>${esc(t('write'))}</a>
      <a class="btn" href="tel:${esc(tel)}">${esc(t('call'))}</a>
    </div>`;

  const gal = $('#gal'), dots = $('#dots');
  if (dots) gal.addEventListener('scroll', () => {
    const w = gal.children[0].offsetWidth + 10;
    const i = Math.min(imgs.length - 1, Math.max(0, Math.round(gal.scrollLeft / w)));
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });

  if (!keepState) {
    $('#wrap').classList.add('open'); $('#wrap').setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    try { if (tg) { tg.BackButton.show(); } } catch(e){}
    haptic();
  }
}

function closeSheet(){
  current = null;
  $('#wrap').classList.remove('open'); $('#wrap').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lock');
  try { tg && tg.BackButton.hide(); } catch(e){}
}

/* ---------- eventlar ---------- */
function toggleFav(id){
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs(); haptic();
  $('#favCount').textContent = favs.size || '';
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => b.classList.toggle('on', favs.has(id)));
  if (favOnly && !current) renderGrid();
}

document.addEventListener('click', e => {
  const ext = e.target.closest('[data-ext]');
  if (ext) { e.preventDefault(); openLink(ext.href); return; }

  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(+fav.dataset.fav); return; }

  if (e.target.closest('#closeBtn') || e.target.id === 'backdrop') { closeSheet(); return; }

  const chip = e.target.closest('.chip');
  if (chip) { cat = chip.dataset.cat; haptic(); renderChips(); renderGrid(); return; }

  const lb = e.target.closest('#langPill button');
  if (lb) { lang = lb.dataset.l; store.set('lang', lang); haptic(); renderAll(); return; }

  if (e.target.closest('#favBtn')) { favOnly = !favOnly; haptic(); renderHeader(); renderGrid(); return; }

  const c = e.target.closest('.card');
  if (c) openSheet(+c.dataset.id);
});

$('#q').addEventListener('input', e => { query = e.target.value; renderGrid(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) closeSheet(); });

/* ---------- start ---------- */
(async function init(){
  try { tg && (tg.ready(), tg.expand(), tg.BackButton.onClick(closeSheet)); } catch(e){}
  applyTheme();
  const params = new URLSearchParams(location.search);
  const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
  lang = params.get('lang') || store.get('lang') || (tgLang === 'ru' ? 'ru' : 'uz');
  if (!UI[lang]) lang = 'uz';
  try {
    const r = await fetch('/api/catalog', { cache: 'no-cache' });
    DATA = await r.json();
  } catch (e) {
    $('#grid').innerHTML = '<p class="empty" style="grid-column:1/-1">Yuklab bo\'lmadi / Не удалось загрузить</p>';
    return;
  }
  renderAll();
  const p = +params.get('p');
  if (p) openSheet(p);
})();
</script>
</body>
